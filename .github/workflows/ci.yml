name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      # deps.edn resolves 7 siblings via :local/root ("../faceid" etc.,
      # relative to this repo's own checkout) -- lay them out as direct
      # siblings under $GITHUB_WORKSPACE to match.
      - uses: actions/checkout@v4
        with: { path: authentication }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/faceid, path: faceid }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/touchid, path: touchid }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/webauthn, path: webauthn }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/onetime, path: onetime }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/oauth, path: oauth }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/oidc, path: oidc }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/saml, path: saml }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/identity, path: identity }

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('authentication/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ matrix.java }}-clj-

      - name: Run tests
        working-directory: authentication
        run: clojure -M:test
